- name: Ping dari Juniper ke 1.1.1.1
  hosts: JUNIPER
  gather_facts: no

  tasks:
    - name: Jalankan ping
      junipernetworks.junos.junos_command:
        commands:
          - show route 1.1.1.1
      register: ping_result

    - name: Tampilkan hasil ping
      debug:
        var: ping_result.stdout_lines